name: Enable GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/enable-pages.yml
  workflow_dispatch:

permissions:
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Publish from the default branch root
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - << 'PY'
          import json, os, urllib.request, urllib.error
          repo = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]
          payload = {"build_type": "legacy", "source": {"branch": "main", "path": "/"}}

          def call(method, path, body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(
                  f"https://api.github.com{path}",
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "cndh-clone-pages",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urllib.request.urlopen(req) as resp:
                      raw = resp.read().decode()
                      print(f"{method} {path} -> {resp.status}")
                      print(raw)
                      return resp.status, raw
              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode()
                  print(f"{method} {path} -> {exc.code}")
                  print(raw)
                  print("accepted-permissions:", exc.headers.get("x-accepted-github-permissions"))
                  return exc.code, raw

          status, raw = call("POST", f"/repos/{repo}/pages", payload)
          if status in (409, 422):
              call("PUT", f"/repos/{repo}/pages", payload)
          get_status, get_raw = call("GET", f"/repos/{repo}/pages")
          if get_status != 200 and status not in (201, 204):
              raise SystemExit(1)
          PY
